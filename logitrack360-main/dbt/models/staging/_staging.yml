version: 2

models:
  - name: stg_logitrack__zones
    description: "Une ligne par zone geographique (pays, ville ou quartier), avec son parent."
    columns:
      - name: zone_id
        description: "Cle de la zone. Les villes portent leur nom (ex. Shanghai), les quartiers un code prefixe par la ville."
        tests: [unique, not_null]
      - name: niveau
        description: "Niveau dans la hierarchie : PAYS, VILLE ou QUARTIER_AOI."
        tests:
          - accepted_values:
              arguments:
                values: ['PAYS', 'VILLE', 'QUARTIER_AOI']

  - name: stg_logitrack__depots
    description: "Une ligne par depot (station logistique)."
    columns:
      - name: depot_id
        tests: [unique, not_null]
      - name: zone_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_logitrack__zones')
                field: zone_id

  - name: stg_logitrack__livreurs
    description: "Une ligne par livreur."
    columns:
      - name: livreur_id
        tests: [unique, not_null]
      - name: statut
        tests:
          - accepted_values:
              arguments:
                values: ['ACTIF', 'INACTIF', 'EN_CONGE']

  - name: stg_logitrack__dates
    description: "Une ligne par jour du calendrier."
    columns:
      - name: date_jour
        tests: [unique, not_null]

  - name: stg_logitrack__operations
    description: "Une ligne par operation de livraison ou de ramassage, sans les coordonnees GPS."
    columns:
      - name: operation_id
        tests: [unique, not_null]
      - name: type_operation
        tests:
          - accepted_values:
              arguments:
                values: ['LIVRAISON', 'RAMASSAGE']
      - name: depot_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_logitrack__depots')
                field: depot_id
      - name: livreur_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_logitrack__livreurs')
                field: livreur_id
